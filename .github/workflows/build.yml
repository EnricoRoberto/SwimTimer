name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SwimTimer

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Imposta Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Imposta Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Crea local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compila APK debug
        run: gradle assembleDebug

      # ← NUOVO: legge versionName da build.gradle
      - name: Leggi versionName
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle | \
                    grep -oP '"\K[^"]+')
          echo "name=$VERSION" >> $GITHUB_OUTPUT

      # ← NUOVO: rinomina il file APK
      - name: Rinomina APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/SwimTimer-v${{ steps.version.outputs.name }}.apk

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: SwimTimer-v${{ github.run_number }}
          path: SwimTimer/app/build/outputs/apk/debug/SwimTimer-v${{ github.run_number }}.apk
